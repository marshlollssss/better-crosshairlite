plugins { id 'fabric-loom' version '1.14.10'; id 'maven-publish' }
version = '1.0.0'
group = 'dev.crosshairlite'
base { archivesName = 'better-crosshairlite-1.21.11' }
repositories {
 maven { url = 'https://maven.terraformersmc.com/releases/' }
}
dependencies {
 minecraft 'com.mojang:minecraft:1.21.11'
 mappings 'net.fabricmc:yarn:1.21.11+build.5:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.18.4'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.3+1.21.11'
 modImplementation 'com.terraformersmc:modmenu:17.0.0'
 testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
test { useJUnitPlatform() }

jar { from("LICENSE") { rename { "LICENSE_crosshairlite" } } }
jar { from("THIRD_PARTY_LICENSES") { into "META-INF/licenses" } }

jar { from("CREDITS.md") }
